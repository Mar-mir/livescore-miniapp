<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نتایج زنده</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d0f;--surface:#16161a;--card:#1c1c20;--border:#26262c;--text:#f2f2f3;--muted:#8a8a90;--dim:#5a5a60;--red:#e11d48;--red-dim:rgba(225,29,72,.12);--red-glow:rgba(225,29,72,.35)}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;-webkit-font-smoothing:antialiased}
header{padding:28px 20px 18px;text-align:center}
header h1{font-size:19px;font-weight:900;letter-spacing:-.3px}
header h1 span{color:var(--red)}
header p{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.2px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}
/* tabs minimal pill */
.tabs{display:flex;gap:6px;padding:0 16px 14px;position:sticky;top:0;z-index:10;background:var(--bg);padding-top:10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;transition:.18s}
.tab.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 6px 18px var(--red-glow)}
.tab .cnt{font-size:10.5px;font-weight:600;opacity:.7}
.tab.active .cnt{opacity:1}
/* league section */
.league{margin:14px 14px 0;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--border)}
.league-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.league-head .lg-name{flex:1;font-size:12px;font-weight:800;letter-spacing:.2px}
.league-head .lg-count{font-size:10px;font-weight:700;color:var(--dim);background:var(--bg);padding:3px 8px;border-radius:20px;border:1px solid var(--border)}
.match{display:flex;align-items:center;gap:10px;padding:14px 14px;border-bottom:1px solid #222228;transition:.12s}
.match:last-child{border-bottom:none}
.match:active{background:var(--red-dim)}
.team{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-width:0}
.team img{width:24px;height:24px;object-fit:contain;flex-shrink:0;border-radius:4px;background:#fff;padding:1px}
.team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.home{justify-content:flex-end;text-align:left}
.team.away{justify-content:flex-start}
.center{min-width:82px;text-align:center;flex-shrink:0}
.score{font-size:17px;font-weight:900;letter-spacing:.5px}
.score.live{color:var(--red)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;margin-top:5px;letter-spacing:.2px}
.badge-live{background:var(--red);color:#fff;animation:pulse 1.4s infinite}
.badge-ft{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.badge-pre{font-size:11px;color:var(--muted);font-weight:600}
.time{font-size:10.5px;color:var(--dim);margin-top:3px}
.details{padding:10px 14px 12px;font-size:11.5px;color:var(--muted);border-top:1px dashed #2a2a30;display:none;line-height:1.7}
.details.open{display:block}
.goal{padding:2px 0}
.goal b{color:var(--text)}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px;line-height:1.7}
.empty span{font-size:30px;display:block;margin-bottom:8px}
.footer{text-align:center;padding:18px;font-size:10px;color:var(--dim);letter-spacing:.2px}
.loading{text-align:center;padding:32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
<h1>⚽ نتایج <span>زنده</span></h1>
<p><span class="dot"></span>بهروزرسانی خودکار هر ۶۰ ثانیه</p>
</header>
<div class="tabs">
<button class="tab active" data-f="live">🔴 زنده <span class="cnt" id="c-live">—</span></button>
<button class="tab" data-f="post">✅ پایان <span class="cnt" id="c-post">—</span></button>
<button class="tab" data-f="pre">⏰ پیش رو <span class="cnt" id="c-pre">—</span></button>
</div>
<div id="list"><div class="loading">در حال دریافت نتایج...</div></div>
<div class="footer">منبع: ESPN &nbsp;·&nbsp; <span id="updated">—</span></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp; if(tg){tg.ready();tg.expand();}
const LEAGUES=[
 {slug:'eng.1',name:'لیگ برتر انگلیس'},
 {slug:'esp.1',name:'لالیگا اسپانیا'},
 {slug:'ita.1',name:'سری آ ایتالیا'},
 {slug:'fra.1',name:'لیگ ۱ فرانسه'},
 {slug:'uefa.europa',name:'لیگ اروپا'},
];
let allGames=[]; let filter='live';
const listEl=document.getElementById('list');
const updEl=document.getElementById('updated');
function fmtTime(iso){
 try{const d=new Date(iso);return d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tehran'})}catch(e){return ''}
}
async function fetchAll(){
 const promises=LEAGUES.map(l=>
  fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${l.slug}/scoreboard`)
   .then(r=>r.json()).then(j=>({league:l,data:j})).catch(()=>null)
 );
 const results=await Promise.all(promises);
 let games=[];
 for(const r of results){
  if(!r||!r.data||!r.data.events) continue;
  for(const ev of r.data.events){
   const comp=ev.competitions&&ev.competitions[0]; if(!comp) continue;
   const home=comp.competitors.find(c=>c.homeAway==='home');
   const away=comp.competitors.find(c=>c.homeAway==='away');
   if(!home||!away) continue;
   const st=comp.status&&comp.status.type||ev.status.type;
   const state=st.state;
   const detail=st.shortDetail||st.detail||'';
   const clock=comp.status&&comp.status.displayClock||'';
   games.push({
    league:r.league, id:ev.id, date:ev.date,
    home:{name:home.team.displayName,logo:home.team.logo,score:home.score},
    away:{name:away.team.displayName,logo:away.team.logo,score:away.score},
    state, detail, clock,
    details:comp.details||[],
    venue:comp.venue&&comp.venue.fullName||'',
   });
  }
 }
 const order={in:0,post:1,pre:2};
 games.sort((a,b)=>(order[a.state]??9)-(order[b.state]??9)|| new Date(a.date)-new Date(b.date));
 allGames=games;
 const cIn=games.filter(g=>g.state==='in').length;
 const cPost=games.filter(g=>g.state==='post').length;
 const cPre=games.filter(g=>g.state==='pre').length;
 document.getElementById('c-live').textContent=cIn?cIn+' بازی':'—';
 document.getElementById('c-post').textContent=cPost?cPost+' بازی':'—';
 document.getElementById('c-pre').textContent=cPre?cPre+' بازی':'—';
 if(filter==='live'&&cIn===0&&cPost>0){ filter='post'; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.f==='post')); }
 render();
 updEl.textContent='آخرین بروزرسانی: '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Asia/Tehran'});
}
function render(){
 const filtered=allGames.filter(g=> g.state=== (filter==='live'?'in':filter));
 if(!filtered.length){
  const msg=filter==='live'?'در حال حاضر بازی زنده‌ای نیست':filter==='post'?'امروز بازی تمام‌شده‌ای نیست':'امروز بازی پیش‌رویی نیست';
  const hint=filter==='live'?'تب «پایان» یا «پیش رو» را ببینید':'';
  listEl.innerHTML=`<div class="empty"><span>${filter==='live'?'😴':filter==='post'?'📭':'🕐'}</span>${msg}${hint?'<br><span style="font-size:11px;opacity:.6">'+hint+'</span>':''}</div>`;
  return;
 }
 const groups={};
 for(const g of filtered){ const k=g.league.slug; if(!groups[k]) groups[k]=[]; groups[k].push(g); }
 let html='';
 for(const lg of LEAGUES){
  const gs=groups[lg.slug]; if(!gs) continue;
  html+=`<div class="league"><div class="league-head"><span class="lg-name">${lg.name}</span><span class="lg-count">${gs.length} بازی</span></div>`;
  for(const g of gs){
   const isLive=g.state==='in',isPost=g.state==='post';
   let center='';
   if(isLive||isPost){
    center=`<div class="score ${isLive?'live':''}">${g.home.score} - ${g.away.score}</div>`+
           (isLive?`<span class="badge badge-live">● زنده ${g.clock||g.detail}</span>`:`<span class="badge badge-ft">${g.detail||'پایان'}</span>`);
   } else {
    center=`<div class="badge-pre">${fmtTime(g.date)}</div><div class="time">${g.venue||''}</div>`;
   }
   let det='';
   if(g.details&&g.details.length){
    det=g.details.filter(d=>d.scoringPlay).map(d=>{
     const pl=d.athletesInvolved&&d.athletesInvolved[0]&&d.athletesInvolved[0].displayName||'';
     const mins=d.clock&&d.clock.displayValue||'';
     const own=d.ownGoal?' (گلبه‌خودی)':'';
     const pen=d.penaltyKick?' (پنالتی)':'';
     return `<div class="goal">⚽ <b>${pl}</b> ${mins}${own}${pen}</div>`;
    }).join('');
   }
   const did=`det-${g.id}`;
   html+=`<div class="match" onclick="document.getElementById('${did}').classList.toggle('open')">
    <div class="team home"><span>${g.home.name}</span><img src="${g.home.logo||''}" onerror="this.style.display='none'"></div>
    <div class="center">${center}</div>
    <div class="team away"><img src="${g.away.logo||''}" onerror="this.style.display='none'"><span>${g.away.name}</span></div>
   </div>${det?`<div class="details" id="${did}">${det}</div>`:`<div class="details" id="${did}" style="display:none"></div>`}`;
  }
  html+=`</div>`;
 }
 listEl.innerHTML=html;
}
document.querySelectorAll('.tab').forEach(b=>{
 b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); filter=b.dataset.f; render();
 });
});
fetchAll();
setInterval(fetchAll,60000);
</script>
</body>
</html>
